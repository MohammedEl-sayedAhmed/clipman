name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # "1" makes the GTK4/libadwaita tests fail instead of skip when the
      # typelibs are missing, so a package rename cannot silently no-op them.
      CLIPMAN_REQUIRE_GTK4: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        timeout-minutes: 4
        run: scripts/deps.sh --dev --install --yes

      - name: Install Python dependencies
        run: pip install -e '.[test]'

      - name: Run tests
        run: scripts/dev.sh test

  package:
    name: package (wheel smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Install the wheel into a clean venv and run the entry point
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          tar tzf dist/*.tar.gz > /tmp/sdist-files.txt
          grep -q 'clipman/style.css' /tmp/sdist-files.txt
          # Leave the checkout so the installed package, not the source tree, is imported.
          cd /tmp
          /tmp/smoke/bin/clipman --version
          /tmp/smoke/bin/python -m clipman --version
          /tmp/smoke/bin/python -c "from importlib.resources import files; assert files('clipman').joinpath('style.css').is_file()"
