name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      # "1" makes the GTK4/libadwaita tests fail instead of skip when the
      # typelibs are missing, so a package rename cannot silently no-op them.
      CLIPMAN_REQUIRE_GTK4: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        timeout-minutes: 4
        run: scripts/deps.sh --dev --install --yes

      - name: Install Python dependencies
        run: pip install -e '.[test]'

      - name: Run tests
        run: scripts/dev.sh test

  package:
    name: package (wheel smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pip install build && python -m build

      - name: Install the wheel into a clean venv and run the entry point
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          PYTHON=python scripts/wheel-smoke.sh dist "$version"

  e2e:
    name: e2e (headless GNOME Shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The system python3, which is the one with the apt GTK bindings.
      # gjs runs the Shell's D-Bus services (gnome-extensions needs one);
      # gnome-shell itself only depends on the library. dconf stores the
      # settings, as in a real session.
      - name: Install GNOME Shell and Clipman's runtime packages
        run: |
          scripts/deps.sh --runtime --install --yes
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gjs dbus-daemon libglib2.0-bin libgl1-mesa-dri \
            dconf-service dconf-gsettings-backend

      # Its own headless Shell, bus and home: install, log in again, copy,
      # open the popup, uninstall. See tests/e2e/install_flow.sh.
      - name: Install, log in again, copy, and uninstall
        run: scripts/dev.sh e2e "$RUNNER_TEMP/e2e"

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/*.out
          if-no-files-found: ignore
