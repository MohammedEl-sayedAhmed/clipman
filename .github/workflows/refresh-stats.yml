name: Refresh project stats

# Fetches PyPI (via pypistats) and GNOME Extensions counts server-side
# once a day, rebuilds the self-hosted star chart and downloads history,
# and commits the results to the `stats` branch.
#
# Why this exists: the marketing page (docs/index.html) renders live
# counts under "By the numbers". The GitHub-derived ones (stars, forks,
# release downloads) come straight from api.github.com, which permits
# cross-origin browser fetches. PyPI's stat endpoints either require an
# API key (pepy.tech v2) or rate-limit, and extensions.gnome.org sends
# no CORS header at all — so client-side fetches silently fail and
# leave the tile showing "—". This workflow does the same fetches from
# a runner (no CORS) and writes numbers.json, which the page reads from
# raw.githubusercontent.com (that host sends
# Access-Control-Allow-Origin: *).
#
# Why a branch of its own: the data used to reach main through a daily
# auto-merge PR opened with the maintainer's personal token. That put a
# bot PR under the maintainer's name every day, moved main daily (so
# every open PR fell behind under strict branch protection), and would
# stall whenever the token expired. The `stats` branch has no
# protection and no required checks, so the built-in token commits to
# it directly: no PR, no personal token, and main only changes when
# people change it. Pushes made with the built-in token start no
# workflows, so this cannot loop.
#
# Readers: docs/index.html (numbers.json) and README.md (the star-history
# SVGs and the downloads history), all through
# raw.githubusercontent.com/MohammedEl-sayedAhmed/clipman/stats/.
# (Until 2026-09 the branch was called `numbers`.)

on:
  schedule:
    # Every day at 06:00 UTC. Snap analytics and PyPI stats update on a
    # ~daily cadence so anything more frequent buys nothing.
    - cron: '0 6 * * *'
  workflow_dispatch:
  # On push to main of the workflow itself or the stats script, run
  # immediately so changes to this job's plumbing are visible quickly.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-stats.yml'
      - 'scripts/refresh_stats.py'

# Default-deny at the workflow level; the single job below is granted
# exactly what it needs (Scorecard Token-Permissions).
permissions: {}

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    # A fork has no use for a stats branch of its own.
    if: github.repository == 'MohammedEl-sayedAhmed/clipman'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # commit to the stats branch
    env:
      DATA_DIR: stats-data
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history, so a first run can seed the stats branch from
          # the last copies main carried. The persisted credentials are
          # the built-in token, which pushes the stats branch below.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check out the stats branch
        run: |
          # ls-remote exits 2 only when the branch is missing, so a
          # network failure stops the job instead of starting over.
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth=1 origin +refs/heads/stats:refs/remotes/origin/stats
            git worktree add -B stats "$DATA_DIR" refs/remotes/origin/stats
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::cannot read the stats branch (git ls-remote exited $status)"
              exit "$status"
            fi
            # First run, or the branch was deleted: start it empty and
            # seed each file with the last copy main carried, so the
            # downloads history is never lost.
            git worktree add --orphan -b stats "$DATA_DIR"
            seed() {
              local rev
              if git cat-file -e "HEAD:$1" 2>/dev/null; then
                git show "HEAD:$1" > "$DATA_DIR/$2"
              elif rev=$(git rev-list -1 HEAD -- "$1") && [ -n "$rev" ]; then
                git show "$rev^:$1" > "$DATA_DIR/$2"
              fi
            }
            seed docs/_data/numbers.json numbers.json
            seed docs/_data/stats_history.json stats_history.json
            seed docs/assets/star-history-dark.svg star-history-dark.svg
            seed docs/assets/star-history-light.svg star-history-light.svg
          fi
          # Rewritten on every run, so it follows renames; its text is
          # fixed, so it adds no commit of its own.
          # shellcheck disable=SC2016  # Markdown backticks, not substitutions
          printf '%s\n' \
            '# stats' \
            '' \
            'Data written once a day by `.github/workflows/refresh-stats.yml`.' \
            'Nothing here is edited by hand; the next run would overwrite it.' \
            '' \
            '- `numbers.json`: PyPI and GNOME Extensions counters for the website.' \
            '- `stats_history.json`: stars and release downloads, one point per change.' \
            '- `star-history-dark.svg`, `star-history-light.svg`: the README star chart.' \
            > "$DATA_DIR/README.md"

      - name: Fetch upstream counters
        run: |
          python3 <<'PY'
          import datetime, json, os, sys, urllib.request, urllib.error

          NUMBERS_PATH = os.path.join(os.environ["DATA_DIR"], "numbers.json")
          GNOME_EXTENSION_ID = 9407
          PYPI_PACKAGE = "clipman-clipboard"
          UA = "clipman-stats/1.0 (+https://github.com/MohammedEl-sayedAhmed/clipman)"
          COMMENT = ("Refreshed daily by .github/workflows/refresh-stats.yml onto the "
                     "stats branch. docs/index.html reads it from raw.githubusercontent.com, "
                     "because the browser cannot read PyPI stats or extensions.gnome.org "
                     "directly (no CORS).")

          def get_json(url, timeout=10):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode("utf-8"))
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, ValueError) as e:
                  print(f"WARN: fetch {url} failed: {e}", file=sys.stderr)
                  return None

          try:
              with open(NUMBERS_PATH) as f:
                  prev = json.load(f)
          except (OSError, ValueError):
              prev = {}

          pypi = get_json(f"https://pypistats.org/api/packages/{PYPI_PACKAGE}/recent")
          gnome = get_json(f"https://extensions.gnome.org/extension-info/?pk={GNOME_EXTENSION_ID}")

          # Preserve prior values on partial failure so a transient outage
          # never wipes the JSON down to zeros. updated_at is carried over
          # unchanged here and only bumped below when a counter actually
          # moved: setting it to now() on every run made the file always
          # differ, so every run would commit.
          new = {
              "_comment": COMMENT,
              "updated_at": prev.get("updated_at"),
              "pypi": dict(prev.get("pypi", {})),
              "gnome": dict(prev.get("gnome", {})),
          }
          if pypi and isinstance(pypi.get("data"), dict):
              d = pypi["data"]
              new["pypi"].update({
                  "package": PYPI_PACKAGE,
                  "last_day":   int(d.get("last_day",   new["pypi"].get("last_day",   0))),
                  "last_week":  int(d.get("last_week",  new["pypi"].get("last_week",  0))),
                  "last_month": int(d.get("last_month", new["pypi"].get("last_month", 0))),
                  "source": f"https://pypistats.org/api/packages/{PYPI_PACKAGE}/recent",
              })
          if gnome and "downloads" in gnome:
              new["gnome"].update({
                  "extension_id": GNOME_EXTENSION_ID,
                  "uuid": gnome.get("uuid", new["gnome"].get("uuid", "")),
                  "downloads": int(gnome["downloads"]),
                  "source": f"https://extensions.gnome.org/extension-info/?pk={GNOME_EXTENSION_ID}",
              })

          # Stamp a fresh timestamp only when a counter changed. If the
          # fetched data matches what's already committed, the file stays
          # byte-identical and the commit step below has nothing to do.
          if new["pypi"] != prev.get("pypi", {}) or new["gnome"] != prev.get("gnome", {}):
              new["updated_at"] = (datetime.datetime.now(tz=datetime.timezone.utc)
                                   .replace(microsecond=0)
                                   .isoformat()
                                   .replace("+00:00", "Z"))

          with open(NUMBERS_PATH, "w") as f:
              json.dump(new, f, indent=2)
              f.write("\n")

          print("Refreshed:", json.dumps({
              "pypi_last_month": new["pypi"].get("last_month"),
              "gnome_downloads": new["gnome"].get("downloads"),
          }))
          PY

      - name: Refresh self-hosted stats (star chart + downloads history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_stats.py --out "$DATA_DIR"

      - name: Commit to the stats branch if anything changed
        env:
          GH_COMMIT_AUTHOR: github-actions[bot]
          GH_COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          cd "$DATA_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "Stats unchanged; nothing to commit."
            exit 0
          fi
          git -c user.name="$GH_COMMIT_AUTHOR" -c user.email="$GH_COMMIT_EMAIL" \
            commit -q -m "chore(stats): refresh project stats"
          git push origin stats
