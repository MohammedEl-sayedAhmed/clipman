<pattern id="hatch-blue" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#1d4ed8" stroke-width="1.4" stroke-opacity="0.09"/></pattern>
<pattern id="hatch-gray" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#57534e" stroke-width="1.4" stroke-opacity="0.09"/></pattern>
<pattern id="hatch-green" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#166534" stroke-width="1.4" stroke-opacity="0.09"/></pattern>
<pattern id="hatch-teal" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#115e59" stroke-width="1.4" stroke-opacity="0.09"/></pattern>
