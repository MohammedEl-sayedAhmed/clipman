<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 642" width="1164" height="642" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Noto Sans', Cantarell, Arial, sans-serif">
<title id="title">Clipman release pipeline</title>
<desc id="desc">A version tag starts release.yml. pre-flight checks that every version carrier matches the tag and that CHANGELOG.md has notes for it; tests run on Python 3.10 to 3.14. Then four builds run side by side: build-pypi (wheel and sdist, smoke-tested), build-snap, bundle-extension and build-distpkgs (.deb and .rpm). publish-pypi uploads with OIDC trusted publishing and publish-snap releases to stable, candidate and beta. Once both succeed, github-release attaches every file with the CHANGELOG notes, and publish-aur pushes the PKGBUILD. The extension zip is uploaded to extensions.gnome.org by hand.</desc>
